<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f1f8e9" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e4d7"/>
      <stop offset="100%" stop-color="#74c69d"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="100%" stop-color="#2d3436"/>
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="600" height="400" rx="24" fill="url(#skyGrad)"/>

  <!-- Morning Sun -->
  <circle cx="500" cy="80" r="45" fill="url(#sunGrad)" opacity="0.85"/>
  <circle cx="500" cy="80" r="58" fill="#ffeaa7" opacity="0.3"/>

  <!-- Distant Rolling Hills -->
  <path d="M 0,280 Q 150,220 320,260 T 600,240 L 600,400 L 0,400 Z" fill="url(#hillGrad1)" opacity="0.6"/>
  <path d="M 0,310 Q 220,250 450,290 T 600,280 L 600,400 L 0,400 Z" fill="url(#hillGrad2)" opacity="0.85"/>

  <!-- College Campus Main Academic Hall -->
  <rect x="180" y="160" width="180" height="150" rx="6" fill="url(#buildingGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Triangular Pediment -->
  <polygon points="170,160 270,110 370,160" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Dome / Clock Tower -->
  <rect x="250" y="80" width="40" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 245,80 Q 270,45 295,80 Z" fill="#52b788"/>
  <!-- Clock -->
  <circle cx="270" cy="95" r="8" fill="#e2e8f0"/>
  <line x1="270" y1="95" x2="270" y2="90" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="270" y1="95" x2="274" y2="95" stroke="#2d6a4f" stroke-width="1.5"/>

  <!-- Campus Hall Windows -->
  <g fill="#74c69d" opacity="0.5">
    <rect x="200" y="180" width="20" height="30" rx="3"/>
    <rect x="235" y="180" width="20" height="30" rx="3"/>
    <rect x="285" y="180" width="20" height="30" rx="3"/>
    <rect x="320" y="180" width="20" height="30" rx="3"/>

    <rect x="200" y="230" width="20" height="30" rx="3"/>
    <rect x="235" y="230" width="20" height="30" rx="3"/>
    <rect x="285" y="230" width="20" height="30" rx="3"/>
    <rect x="320" y="230" width="20" height="30" rx="3"/>
  </g>

  <!-- Campus Entrance Pillars -->
  <rect x="260" y="260" width="20" height="50" fill="#2d6a4f"/>

  <!-- Rooftop Solar Panels -->
  <g transform="translate(190, 130) skewX(-15)">
    <rect x="0" y="0" width="65" height="22" rx="2" fill="url(#solarGrad)"/>
    <line x1="22" y1="0" x2="22" y2="22" stroke="#74b9ff" stroke-width="1"/>
    <line x1="44" y1="0" x2="44" y2="22" stroke="#74b9ff" stroke-width="1"/>
    <line x1="0" y1="11" x2="65" y2="11" stroke="#74b9ff" stroke-width="1"/>
  </g>
  <g transform="translate(285, 130) skewX(-15)">
    <rect x="0" y="0" width="65" height="22" rx="2" fill="url(#solarGrad)"/>
    <line x1="22" y1="0" x2="22" y2="22" stroke="#74b9ff" stroke-width="1"/>
    <line x1="44" y1="0" x2="44" y2="22" stroke="#74b9ff" stroke-width="1"/>
    <line x1="0" y1="11" x2="65" y2="11" stroke="#74b9ff" stroke-width="1"/>
  </g>

  <!-- Modern Clean Wind Turbine -->
  <g transform="translate(480, 160)">
    <!-- Tower -->
    <polygon points="-4,150 4,150 2,0 -2,0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Rotor Hub -->
    <circle cx="0" cy="0" r="6" fill="#2d6a4f"/>
    <!-- Blades -->
    <path d="M 0,0 Q 8,-40 2,-70 Q -3,-40 0,0 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,0 Q 40,8 65,25 Q 35,28 0,0 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,0 Q -30,25 -65,35 Q -38,8 0,0 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Green Ground / Meadow -->
  <path d="M 0,330 Q 300,320 600,335 L 600,400 L 0,400 Z" fill="#1b4332"/>

  <!-- Paved Bicycle / Walking Path -->
  <path d="M 0,380 Q 250,330 450,400" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
  <path d="M 0,380 Q 250,330 450,400" fill="none" stroke="#52b788" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Campus Trees & Foliage -->
  <!-- Tree 1 Left -->
  <rect x="90" y="270" width="14" height="60" rx="3" fill="#6d4c41"/>
  <circle cx="97" cy="245" r="40" fill="#2d6a4f"/>
  <circle cx="80" cy="235" r="30" fill="#40916c"/>
  <circle cx="115" cy="240" r="28" fill="#52b788"/>

  <!-- Tree 2 Mid-Left -->
  <rect x="150" y="295" width="10" height="40" rx="2" fill="#6d4c41"/>
  <circle cx="155" cy="275" r="28" fill="#52b788"/>
  <circle cx="145" cy="270" r="20" fill="#74c69d"/>

  <!-- Tree 3 Right -->
  <rect x="410" y="280" width="12" height="55" rx="3" fill="#6d4c41"/>
  <circle cx="416" cy="250" r="35" fill="#40916c"/>
  <circle cx="430" cy="245" r="26" fill="#74c69d"/>

  <!-- Campus 3-Color Waste Segregation Bins -->
  <g transform="translate(60, 320)">
    <!-- Green Bin (Organic) -->
    <rect x="0" y="0" width="16" height="26" rx="3" fill="#2e7d32"/>
    <rect x="-2" y="-4" width="20" height="5" rx="2" fill="#1b5e20"/>
    <circle cx="8" cy="12" r="3" fill="#ffffff" opacity="0.8"/>

    <!-- Blue Bin (Recyclable) -->
    <rect x="22" y="0" width="16" height="26" rx="3" fill="#1976d2"/>
    <rect x="20" y="-4" width="20" height="5" rx="2" fill="#0d47a1"/>
    <circle cx="30" cy="12" r="3" fill="#ffffff" opacity="0.8"/>

    <!-- Red/Grey Bin (Hazardous/Other) -->
    <rect x="44" y="0" width="16" height="26" rx="3" fill="#546e7a"/>
    <rect x="42" y="-4" width="20" height="5" rx="2" fill="#37474f"/>
    <circle cx="52" cy="12" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Eco Mascot Flying with Leaf -->
  <g transform="translate(480, 260) scale(0.65)">
    <circle cx="0" cy="0" r="35" fill="#52b788" stroke="#1b4332" stroke-width="2"/>
    <circle cx="-10" cy="-5" r="4" fill="#081c15"/>
    <circle cx="10" cy="-5" r="4" fill="#081c15"/>
    <path d="M -8,8 Q 0,16 8,8" fill="none" stroke="#081c15" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0,-35 Q 15,-55 30,-45 Q 15,-30 0,-35" fill="#95d5b2" stroke="#1b4332" stroke-width="1.5"/>
  </g>
</svg>
